name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Dagelijkse live SEO-guardrail om 06:13 UTC
    - cron: "13 6 * * *"
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: life-journey-backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Lint (ruff)
        run: ruff check app/

      - name: Type check (mypy)
        # Advies, niet blokkerend: de codebase gebruikt nog legacy Column(...)-typing
        # i.p.v. Mapped[], waardoor mypy ORM-kolommen als type-mismatch ziet.
        # TODO: modellen migreren naar Mapped[] en deze regel verwijderen.
        continue-on-error: true
        run: mypy app/ --ignore-missing-imports

      - name: Test (pytest)
        env:
          ENVIRONMENT: development
          JWT_SECRET_KEY: ci-test-secret-key-for-testing-only-32chars
          DATABASE_URL: sqlite:///./test.db
        run: pytest tests/ -v --tb=short

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: life-journey-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: life-journey-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test (vitest)
        run: npm test

  # ── Live SEO-integrity guard (niet-blokkerend) ──
  # Draait de seo-integrity live-checks dagelijks tegen productie. Vangt
  # regressies op die via de DB/content veranderen zonder code-push (bijv. een
  # artikel gearchiveerd dat nog in een redirect-bron staat). Fouten openen een
  # issue, maar breken de deploy niet.
  seo-live-check:
    name: Live SEO integrity (daily)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: life-journey-frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: life-journey-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Live SEO integrity
        env:
          SEO_LIVE_CHECK: "1"
        run: npm test -- src/__tests__/seo-integrity.test.ts
      - name: Open issue bij falen
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Live SEO-integrity check gefaald",
              body: "De dagelijkse SEO-guardrail (redirects/sitemap vs productie) faalde. Controleer de GSC pagina-indexering en de workflow-run:\n" + context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId,
              labels: ["seo", "bug"]
            })
